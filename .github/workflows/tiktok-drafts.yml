name: Send video to TikTok drafts
# Runs when demo/request.json is pushed with a fresh one-time code from callback.html.
# Exchanges the code, confirms the connected account, and uploads the video to that
# account's TikTok drafts inbox. Tokens are masked and never stored.
on:
  push:
    paths: [demo/request.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      CLIENT_KEY: sbawk2nq3p9miptjd6
      CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      REDIRECT: https://rbuxton03-cmyk.github.io/everyday-explained-site/callback.html
    steps:
      - uses: actions/checkout@v4
      - name: Upload to drafts
        run: |
          set -euo pipefail
          CODE=$(jq -r .code demo/request.json)
          TOK=$(curl -sS -X POST https://open.tiktokapis.com/v2/oauth/token/ \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_key=$CLIENT_KEY" --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "code=$CODE" --data-urlencode grant_type=authorization_code \
            --data-urlencode "redirect_uri=$REDIRECT")
          AT=$(echo "$TOK" | jq -r '.access_token // empty')
          if [ -z "$AT" ]; then echo "token exchange failed: $(echo "$TOK" | jq -c '{error,error_description}')"; exit 1; fi
          echo "::add-mask::$AT"
          echo "Scopes granted: $(echo "$TOK" | jq -r .scope)"
          NAME=$(curl -sS 'https://open.tiktokapis.com/v2/user/info/?fields=display_name' -H "Authorization: Bearer $AT" | jq -r .data.user.display_name)
          echo "Connected TikTok account: $NAME"
          # request.json: {"code": "...", "videos": ["demo/a.mp4", ...]}  (old {"video": "..."} still works)
          FAILS=0; N=0
          GAP=$(jq -r '.gap // 0' demo/request.json)   # seconds between videos, so each draft can be saved first
          for VIDEO in $(jq -r '(.videos // [.video])[]' demo/request.json); do
            if [ "$N" -gt 0 ] && [ "$GAP" -gt 0 ]; then echo "waiting ${GAP}s before the next video"; sleep "$GAP"; fi
            N=$((N+1))
            echo "--- $VIDEO"
            SIZE=$(stat -c %s "$VIDEO")
            INIT=$(curl -sS -X POST https://open.tiktokapis.com/v2/post/publish/inbox/video/init/ \
              -H "Authorization: Bearer $AT" -H 'Content-Type: application/json; charset=UTF-8' \
              -d "{\"source_info\":{\"source\":\"FILE_UPLOAD\",\"video_size\":$SIZE,\"chunk_size\":$SIZE,\"total_chunk_count\":1}}")
            echo "init: $(echo "$INIT" | jq -c '.error')"
            URL=$(echo "$INIT" | jq -r .data.upload_url); PID=$(echo "$INIT" | jq -r .data.publish_id)
            echo "::add-mask::$URL"
            curl -sS -X PUT "$URL" -H 'Content-Type: video/mp4' -H "Content-Range: bytes 0-$((SIZE-1))/$SIZE" --data-binary @"$VIDEO" -o /dev/null -w "upload HTTP %{http_code}\n"
            for i in $(seq 1 24); do
              sleep 5
              ST=$(curl -sS -X POST https://open.tiktokapis.com/v2/post/publish/status/fetch/ \
                -H "Authorization: Bearer $AT" -H 'Content-Type: application/json; charset=UTF-8' -d "{\"publish_id\":\"$PID\"}" | jq -r '.data.status')
              echo "status: $ST"
              case "$ST" in SEND_TO_USER_INBOX|PUBLISH_COMPLETE) echo "Done: $VIDEO is in your TikTok drafts inbox."; break;; FAILED) echo "FAILED: $VIDEO"; FAILS=$((FAILS+1)); break;; esac
            done
          done
          exit $FAILS
